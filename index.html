<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ویڈیو ایڈیٹر - کاکا لافٹ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');
        body {
            font-family: 'Noto Nastaliq Urdu', serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- نیوی گیشن بار -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-xl font-bold text-emerald-400">AI ویڈیو ایڈیٹر پرو</h1>
        </div>
        <div class="text-sm text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
            آن لائن سسٹم فعال ہے
        </div>
    </header>

    <!-- مین کنٹینٹ -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- بایاں حصہ: کنٹرول پینل -->
        <section class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-xl flex flex-col gap-5">
            <h2 class="text-lg font-bold text-emerald-300 border-b border-slate-700 pb-2">ویڈیو ایڈیٹنگ کنٹرولز</h2>

            <!-- ویڈیو اپ لوڈ سیکشن -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-slate-300">ویڈیو منتخب کریں (MP4/MOV):</label>
                <div class="border-2 border-dashed border-slate-600 hover:border-emerald-500 rounded-xl p-6 text-center cursor-pointer bg-slate-900/40 transition">
                    <input type="file" id="videoInput" accept="video/*" class="hidden">
                    <label for="videoInput" class="cursor-pointer flex flex-col items-center gap-2">
                        <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <span class="text-sm text-slate-300">فائل یہاں اپ لوڈ کرنے کے لیے کلک کریں</span>
                    </label>
                </div>
            </div>

            <!-- بیک گ라운ڈ تبدیل کرنے کا آپشن -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-slate-300">پس منظر (Background) تبدیل کریں:</label>
                <select class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-emerald-500">
                    <option>پرانا پس منظر ہٹائیں (Transparent / Blur)</option>
                    <option>سٹوڈیو بیک گ라운ڈ (Studio)</option>
                    <option>قدرتی مناظر (Nature Scenery)</option>
                    <option>سائبرپಂಕ್ سٹی (Cyberpunk)</option>
                </select>
            </div>

            <!-- لباس اور ڈیزائن (Outfit & Clothing Editor) -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-slate-300">کپڑوں اور ڈیزائن کی تبدیلی (प्रॉम्प्ट):</label>
                <input type="text" placeholder="مثلاً: سیاہ سوٹ اور روایتی کرتہ" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- پروسیس بٹن -->
            <button onclick="alert('ویڈیو پروسیسنگ شروع ہو چکی ہے!')" class="mt-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                <span>ویڈیو پروسیس کریں</span>
            </button>
        </section>

        <!-- دایاں حصہ: پرویو اور آؤٹ پٹ -->
        <section class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-xl flex flex-col gap-5">
            <h2 class="text-lg font-bold text-emerald-300 border-b border-slate-700 pb-2">ویڈیو آؤٹ پٹ اور پرویو</h2>
            
            <div class="flex-1 bg-slate-900 border border-slate-700 rounded-xl flex items-center justify-center relative min-h-[280px] overflow-hidden">
                <div class="text-center text-slate-500 flex flex-col items-center gap-2">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span>ابھی تک کوئی ویڈیو منتخب نہیں کی گئی</span>
                </div>
            </div>

            <!-- ڈاؤن لوڈ بٹن -->
            <button class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 px-6 rounded-xl transition duration-200 text-center">
                ایڈٹ شدہ ویڈیو ڈاؤن لوڈ کریں
            </button>
        </section>

    </main>

    <!-- فوٹر -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        جملہ حقوق محفوظ ہیں - AI ویڈیو ایڈیٹر ویب ایپ
    </footer>

</body>
</html>
